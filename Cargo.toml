[package]
name = "singlenum"
version = "0.3.0"
edition = "2021"
default-run = "singlenum"

[features]
default = []
gui = ["dep:eframe", "dep:rfd"]

[[bin]]
name = "singlenum-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1.0.93"
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.15", optional = true }
camino = "1.1.9"
clap = { version = "4.5.21", features = ["derive", "cargo"] }
clap_complete = "4.5.33"
env_logger = "0.11.5"
log = "0.4.22"
rand = "0.8.5"
serde_json = "1.0.133"
walkdir = "2.5.0"

[profile.release]
# Binary optimization for release build
# https://github.com/johnthagen/min-sized-rust
strip = true
lto = true
codegen-units = 1
